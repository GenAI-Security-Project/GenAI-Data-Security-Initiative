name: datasets-release

# Cuts a versioned datasets release when a tag datasets-v<version> is pushed
# (the version must equal CITATION.cff's). It re-runs every check, builds one
# zip per dataset plus an all-datasets zip, writes SHA256SUMS, attests build
# provenance for every file with Sigstore (verify with `gh attestation
# verify <file> --repo GenAI-Security-Project/GenAI-Data-Security-Initiative`),
# and publishes a GitHub release. With the repository enabled in Zenodo's
# GitHub integration, Zenodo archives each release and mints a DOI.
on:
  push:
    tags:
      - 'datasets-v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install requirements
        run: python -m pip install --quiet -r data_validation/requirements.txt -r data_validation/requirements-croissant.txt

      - name: Tag matches CITATION.cff
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#datasets-v}"
          cff_version=$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' CITATION.cff)
          if [ "$tag_version" != "$cff_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match CITATION.cff version $cff_version"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Every check passes
        run: |
          python data_validation/run_all_checks.py
          python data_validation/qc_tools/consistency_check.py
          python data_validation/croissant/build_croissant.py --check
          python data_validation/croissant/check_croissant.py

      - name: Build archives and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          for croissant in datasets/*/croissant.json; do
            name=$(basename "$(dirname "$croissant")")
            git archive --format=zip -o "dist/owasp-dsgai-${name}-${VERSION}.zip" HEAD \
              "datasets/${name}" datasets/_shared CITATION.cff LICENSE
          done
          git archive --format=zip -o "dist/owasp-dsgai-datasets-${VERSION}.zip" HEAD \
            datasets data_validation/reference_data data_validation/schemas CITATION.cff LICENSE
          (cd dist && sha256sum ./*.zip > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "Datasets release ${VERSION} of the OWASP GenAI Data Security Initiative."
            echo
            echo "Each dataset archive contains the dataset folder (with its MLCommons Croissant 1.1 metadata), the shared DSGAI taxonomy, CITATION.cff and the licence."
            echo
            echo "Verify a download:"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Datasets ${VERSION}" --notes-file notes.md
