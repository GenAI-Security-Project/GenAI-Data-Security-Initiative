name: datasets-validate-all

# Runs data_validation/run_all_checks.py: every dataset's own validate.py
# (including ones in sub-collections), then the shared checks in
# data_validation/validators/ on every data file, and the cross-dataset
# consistency check. The tests job runs the data_validation test suite on
# each supported Python. The coverage report and anomaly list go to the job
# summary for reviewers; they never fail the job.

on:
  push:
    branches: [main]
    paths:
      - 'datasets/**'
      - 'data_validation/**'
      - '.github/workflows/datasets-validate-all.yml'
  pull_request:
    paths:
      - 'datasets/**'
      - 'data_validation/**'
      - '.github/workflows/datasets-validate-all.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install requirements
        run: python -m pip install --quiet -r data_validation/requirements.txt

      - name: Run every dataset validator and the shared checks
        run: python data_validation/run_all_checks.py --verbose --github

      - name: Cross-dataset consistency
        run: python data_validation/qc_tools/consistency_check.py

      - name: Coverage report and anomalies (job summary)
        if: always()
        run: |
          python data_validation/qc_tools/bias_report.py >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo '## Anomalies'
            echo
            echo '```'
            python data_validation/qc_tools/anomaly_detector.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The tooling's own tests on every Python release it supports, plus lint
  # (ruff), types (mypy) and a coverage floor; config in data_validation/pyproject.toml.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install requirements (hash-pinned)
        run: python -m pip install --quiet -r data_validation/requirements-dev.txt

      - name: Lint (ruff)
        working-directory: data_validation
        run: ruff check . ../datasets/_shared/validate_lib.py --output-format github

      - name: Types (mypy)
        working-directory: data_validation
        run: mypy

      - name: data_validation tests with coverage
        working-directory: data_validation
        run: python -m pytest -v --cov --cov-report=term

  # gitleaks (pinned release, checksum verified) over the data and tooling.
  # Blocking: its rules target real credential formats, and the datasets'
  # synthetic secrets use placeholders that it does not match.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks

      - name: Scan datasets and data_validation for secrets
        run: |
          ./gitleaks dir datasets --redact --no-banner --exit-code 1
          ./gitleaks dir data_validation --redact --no-banner --exit-code 1

  # Named-entity scan for person and organisation names in the datasets that
  # require anonymization. Warnings for reviewers; never fails the job.
  ner-pii:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install requirements
        run: python -m pip install --quiet -r data_validation/requirements.txt -r data_validation/requirements-ner.txt

      - name: NER scan (job summary)
        run: |
          {
            echo '## Name detection (NER) in anonymized datasets'
            echo
            echo '```'
            python data_validation/qc_tools/ner_pii_scan.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # MLCommons Croissant 1.1 metadata: up to date with the data (checksums,
  # fields, dates), valid per mlcroissant, and loadable record by record.
  croissant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install requirements
        run: python -m pip install --quiet -r data_validation/requirements-croissant.txt

      - name: croissant.json files are up to date
        run: python data_validation/croissant/build_croissant.py --check

      - name: Validate and load every Croissant file
        run: python data_validation/croissant/check_croissant.py
