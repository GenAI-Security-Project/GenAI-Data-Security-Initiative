name: datasets-validate-all

# Runs data_validation/run_all_checks.py, which runs every dataset's own
# validate.py, so the PR template's "validation scripts pass" box is checked
# by CI for every dataset rather than only the ones with their own workflow.
on:
  push:
    branches: [main]
    paths:
      - 'datasets/**'
      - 'data_validation/**'
      - '.github/workflows/datasets-validate-all.yml'
  pull_request:
    paths:
      - 'datasets/**'
      - 'data_validation/**'
      - '.github/workflows/datasets-validate-all.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install jsonschema and pytest
        run: python -m pip install --quiet jsonschema pytest

      - name: Run every dataset validator
        run: python data_validation/run_all_checks.py

      - name: Runner tests
        run: python -m pytest data_validation/tests/test_run_all_checks.py -v
